# 本机实跑覆盖层（在这台笔记本上把系统真正跑起来）。
#
# 与 docker-compose.prod.yml 的关系：那份是给真实服务器用的（前置 nginx/caddy 终止 HTTPS，
# 占 3000）。本文件只改两处，其余全部继承：
#
#   1. **端口改 3100**：3000 常被开发服务器占用；分开后两者可并存，
#      不必为了跑一次生产版而杀掉正在用的 dev server。
#   2. **仍然只绑 127.0.0.1**：默认只有本机能访问。
#
# 若要让同一局域网的同事也能打开（例如仓库、采购在别的电脑上用），
# 把下面 ports 改成 "0.0.0.0:3100:3000"，并同步把 .env.prod 里的
# AUTH_URL 改成 http://<本机局域网IP>:3100 —— 否则登录回跳会指向 localhost 而失败。
#
# ⚠ 开放到局域网前请想清楚：这是明文 HTTP，同网段任何人都能访问和抓包。
# 内网试用可以接受；要长期用应放到有 HTTPS 的服务器上，或至少限制到可信网段。
#
# 用法：
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml --env-file .env.prod up -d
services:
  app:
    # !override 是必须的：Compose 对列表是**合并**而非替换，
    # 不加它会同时绑 3000 和 3100，于是照旧撞上开发服务器占用的 3000。
    ports: !override
      - "127.0.0.1:3100:3000"
  db:
    # 把库暴露到本机 15432，便于播种、备份与排查（仍只绑 127.0.0.1，外部访问不到）。
    # 生产 compose 刻意不暴露数据库端口，故只在本覆盖层加。
    ports: !override
      - "127.0.0.1:15432:5432"
