# 生产编排（staging 同构，仅 env 不同）。部署走 ops/deploy.sh（含迁移门禁），勿直接 up。
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产必须显式设置}
      POSTGRES_DB: scm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scm"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  # 迁移门禁（ops/deploy.sh 调用；profiles 保证它不会随 `up -d` 一起常驻）。
  # 必须用 migrator 阶段——runner 里没有 drizzle-kit 的依赖，见 Dockerfile 注释。
  migrate:
    build:
      context: .
      target: migrator
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://scm:${POSTGRES_PASSWORD}@db:5432/scm
    restart: "no"

  app:
    build:
      context: .
      args:
        # HSTS 是构建期开关（next.config.ts 的 headers() 在 next build 时求值并烘焙进
        # routes-manifest.json）。放在 environment 里是无效的——2026-08-07 实测容器 env
        # 有 PUBLIC_HTTPS=1 但响应头里没有 HSTS。走稳定 HTTPS 域名时才置 1，
        # 且必须重新构建镜像：docker compose build --build-arg PUBLIC_HTTPS=1 app
        PUBLIC_HTTPS: ${PUBLIC_HTTPS-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://scm:${POSTGRES_PASSWORD}@db:5432/scm
      AUTH_SECRET: ${AUTH_SECRET:?}
      # 必填，且不能靠 trustHost 省掉。
      # 实测（2026-08-05，standalone 容器）：AUTH_URL 留空时 credentials 回调会解析成
      # 服务端自身的绑定地址 http://0.0.0.0:3000 ——即便 auth/config.ts 与 middleware.ts
      # 都已 trustHost: true 也一样，因为 standalone 用 HOSTNAME/PORT 兜底而非请求 Host 头。
      # 机器 IP 变了就必须同步这里：`npm run lan:sync` 会自动改好并重启。
      AUTH_URL: ${AUTH_URL:?}
      # 注意：PUBLIC_HTTPS 刻意**不**放在这里。它只在构建期有意义（见上面 build.args），
      # 放运行期会让人以为改了就生效，实际什么也不会发生。

      # 飞书：留空仍是未配置；不在 Compose 内造出可运行默认值。
      FEISHU_APP_ID: ${FEISHU_APP_ID-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET-}
      FEISHU_CHAT_ID: ${FEISHU_CHAT_ID-}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL-}
      # 群机器人签名密钥：缺了它签名校验发不出消息（容器与本地行为分叉的典型来源）
      FEISHU_WEBHOOK_SECRET: ${FEISHU_WEBHOOK_SECRET-}
      FEISHU_APP_LIVE_VERIFIED_AT: ${FEISHU_APP_LIVE_VERIFIED_AT-}
      FEISHU_APP_LIVE_VERIFIED_REF: ${FEISHU_APP_LIVE_VERIFIED_REF-}
      FEISHU_WEBHOOK_LIVE_VERIFIED_AT: ${FEISHU_WEBHOOK_LIVE_VERIFIED_AT-}
      FEISHU_WEBHOOK_LIVE_VERIFIED_REF: ${FEISHU_WEBHOOK_LIVE_VERIFIED_REF-}

      # 聚水潭：凭据、可选观察流开关与 UAT 证据原样传递。
      JST_APP_KEY: ${JST_APP_KEY-}
      JST_APP_SECRET: ${JST_APP_SECRET-}
      JST_ACCESS_TOKEN: ${JST_ACCESS_TOKEN-}
      JST_SYNC_ACTOR_ID: ${JST_SYNC_ACTOR_ID-}
      JST_BASE_URL: ${JST_BASE_URL-}
      JST_INVENTORY_SYNC_ENABLED: ${JST_INVENTORY_SYNC_ENABLED-}
      JST_OBSERVATION_SYNC_CONTRACTS: ${JST_OBSERVATION_SYNC_CONTRACTS-}
      # 可信仓白名单：业务口径「只有一仓准」的落地开关，缺了库存流会被拒绝启用
      JST_TRUSTED_WMS_CO_IDS: ${JST_TRUSTED_WMS_CO_IDS-}
      JST_TOKEN_OBTAINED_AT: ${JST_TOKEN_OBTAINED_AT-}
      JST_TOKEN_TTL_DAYS: ${JST_TOKEN_TTL_DAYS-}
      JST_LIVE_VERIFIED_AT: ${JST_LIVE_VERIFIED_AT-}
      JST_LIVE_VERIFIED_REF: ${JST_LIVE_VERIFIED_REF-}

      # 简道云：凭据不会隐式打开同步，契约也必须显式选择。
      JIANDAOYUN_API_KEY: ${JIANDAOYUN_API_KEY-}
      JIANDAOYUN_SYNC_ACTOR_ID: ${JIANDAOYUN_SYNC_ACTOR_ID-}
      JIANDAOYUN_SYNC_ENABLED: ${JIANDAOYUN_SYNC_ENABLED-}
      JIANDAOYUN_SYNC_CONTRACTS: ${JIANDAOYUN_SYNC_CONTRACTS-}
      JIANDAOYUN_BASE_URL: ${JIANDAOYUN_BASE_URL-}
      JIANDAOYUN_LIVE_VERIFIED_AT: ${JIANDAOYUN_LIVE_VERIFIED_AT-}
      JIANDAOYUN_LIVE_VERIFIED_REF: ${JIANDAOYUN_LIVE_VERIFIED_REF-}

      # 用友：在产品、租户、组织、主机和获批契约齐全前仍为 contract_only。
      YY_APP_KEY: ${YY_APP_KEY-}
      YY_APP_SECRET: ${YY_APP_SECRET-}
      YY_CLIENT_ID: ${YY_CLIENT_ID-}
      YY_CLIENT_SECRET: ${YY_CLIENT_SECRET-}
      YY_TENANT_ID: ${YY_TENANT_ID-}
      YY_ORG_ID: ${YY_ORG_ID-}
      YY_PRODUCT_PROFILE: ${YY_PRODUCT_PROFILE-}
      YY_APPROVED_API_CONTRACTS: ${YY_APPROVED_API_CONTRACTS-}
      YY_ALLOWED_HOSTS: ${YY_ALLOWED_HOSTS-}
      YY_BASE_URL: ${YY_BASE_URL-}
      YY_TOKEN_URL: ${YY_TOKEN_URL-}
      YY_SYNC_ENABLED: ${YY_SYNC_ENABLED-}
      YY_SYNC_ACTOR_ID: ${YY_SYNC_ACTOR_ID-}

      FILE_STORAGE_DIR: /data/uploads
      # Next.js standalone 默认绑到容器主机名对应的那个 IP，而不是 0.0.0.0。
      # 后果很隐蔽：宿主机通过端口映射访问正常，但容器内 127.0.0.1:3000 根本没监听，
      # 于是 healthcheck（用的就是 127.0.0.1）**永远失败**——容器长期 unhealthy，
      # 在真正的编排环境里会被判定为未就绪或反复重启。已实测 /proc/net/tcp 只有容器 IP 在听。
      HOSTNAME: "0.0.0.0"
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3000:3000" # 前置 nginx/caddy 终止 HTTPS
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const b=await r.json();if(!r.ok||b.ok!==true)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  # 备份附件不依赖 app 镜像可构建/可启动；只读挂载 compose 逻辑卷，profile=ops 时按需运行。
  backup-files:
    # 与生产构建基镜像一致；部署完成后必已在本机，备份脚本以 --pull never 禁止运行时依赖 registry。
    image: node:24-alpine
    profiles: ["ops"]
    entrypoint: ["sh"]
    volumes:
      - uploads:/data/uploads:ro
volumes:
  pgdata:
  uploads:
