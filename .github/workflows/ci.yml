name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:full
      - run: npm run typecheck:all
      - run: npm run check:ops
      - run: npm run test:fast

  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/build-ci-container.sh

  postgres:
    name: PostgreSQL migration contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scm
          POSTGRES_PASSWORD: scm_ci_password
          POSTGRES_DB: scm_contract_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scm -d scm_contract_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://scm:scm_ci_password@127.0.0.1:5432/scm_contract_ci
      SCM_ALLOW_MUTATING_PG_CONTRACT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check:postgres
      - run: npm run check:postgres:jdy-concurrency
      - run: npm run check:postgres:sku-identity-concurrency
      - run: npm run check:postgres:review-atomicity
      - name: NPD versions, replay and audit atomicity (isolated PostgreSQL)
        run: node --import tsx scripts/verify-postgres-npd-write.ts
      - name: Supply parameter edits and preview row locks (isolated PostgreSQL)
        run: node --import tsx scripts/verify-postgres-supply-params.ts
      - name: Yonyou retries and concurrency (isolated PostgreSQL)
        env:
          NODE_ENV: test
          SCM_RUN_JOBS: "0"
          SCM_ALLOW_MUTATING_PG_CONTRACT: "1"
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const source = new URL(process.env.DATABASE_URL ?? '');
          if (source.protocol !== 'postgres:' || source.hostname !== '127.0.0.1'
            || source.port !== '5432' || source.pathname !== '/scm_contract_ci'
            || source.search || source.hash) {
            throw new Error('Refusing database creation outside the isolated CI PostgreSQL service');
          }
          const client = new pg.Client({
            connectionString: source.href, connectionTimeoutMillis: 5000, query_timeout: 15000,
            options: '-c statement_timeout=10000 -c lock_timeout=5000',
          });
          await client.connect();
          try { await client.query('CREATE DATABASE scm_contract_yonyou_ci'); }
          finally { await client.end(); }
          NODE
          candidate_dir=$(mktemp -d /tmp/expscm-yonyou-ci.XXXXXX)
          cp -R src drizzle scripts "$candidate_dir/"
          cp package.json package-lock.json tsconfig.json drizzle.config.ts "$candidate_dir/"
          ln -s "$PWD/node_modules" "$candidate_dir/node_modules"
          cd "$candidate_dir"
          export DATABASE_URL="${DATABASE_URL%/scm_contract_ci}/scm_contract_yonyou_ci"
          export FILE_STORAGE_DIR="$candidate_dir/.data/yonyou-evidence"
          npm run db:migrate
          npm run check:postgres
          npm run check:postgres:yonyou-concurrency
